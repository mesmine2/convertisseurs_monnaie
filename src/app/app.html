<!-- src/app/app.html -->
<header class="header">
  <h1>💱 Convertisseur FCFA</h1>
</header>

<main class="container">
  <div class="carte">
    <label>
      Montant
      <input
        type="number"
        [value]="montant()"
        (input)="onMontantChange($event)"
        min="0"
      >
    </label>

    <div class="selecteurs">
      <label>
        De
        <select [value]="deviseSource()" (change)="onDeviseSourceChange($event)">
          @for (d of devises; track d.code) {
            <option [value]="d.code">{{ d.code }} — {{ d.nom }}</option>
          }
        </select>
      </label>

      <button class="btn-inverser" (click)="inverser()" aria-label="Inverser les devises">⇄</button>

      <label>
        Vers
        <select [value]="deviseCible()" (change)="onDeviseCibleChange($event)">
          @for (d of devises; track d.code) {
            <option [value]="d.code">{{ d.code }} — {{ d.nom }}</option>
          }
        </select>
      </label>
    </div>

    <div class="resultat">
      <span class="valeur">{{ resultat() | number:'1.2-2' }}</span>
      <span class="code">{{ deviseCible() }}</span>
    </div>
  </div>
</main>

<footer class="footer">
  <p>Taux fixes à titre de démonstration — pas des taux en temps réel.</p>
</footer>
